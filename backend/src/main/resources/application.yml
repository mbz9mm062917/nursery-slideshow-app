server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/nursery_slideshow?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Tokyo
    username: ${DB_USERNAME:nursery_app}
    password: ${DB_PASSWORD:nursery_app}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 500MB

app:
  storage:
    root-dir: ${STORAGE_ROOT_DIR:./storage}
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}
  ffmpeg:
    binary-path: ${FFMPEG_BINARY_PATH:ffmpeg}
    title-font-path: ${FFMPEG_TITLE_FONT_PATH:C:/Windows/Fonts/meiryo.ttc}
    timeout-seconds: ${FFMPEG_TIMEOUT_SECONDS:120}
